<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Data</legend>
            <fieldset>
                <legend>Your Name</legend>
                <p>
                    <label for="first name">First Name: </label>
                    <input type="text" id="first name" name="first_name" placeholder="ex: Ahmed">
                </p>
                <p>
                    <label for="second name">Second Name: </label>
                    <input type="text" id="second name" name="second_name" placeholder="ex: El-Daly">
                </p>
            </fieldset>
            <br>
            <p>
                <label for="phone">Your Phone: </label>
                <input type="tel" id="phone" name="phone">
            </p>
            <p>
                <label for="email">Your Email: </label>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <label for="password">Your Password: </label>
                <input type="password" id="password" name="password">
            </p>
            <p>
                <label for="repassword">Repassword: </label>
                <input type="password" id="repassword" name="repassword">
            </p>
            <p>
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" value="male">
                <br>
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="female">
            </p>
<br>
            <p>
                <label for="student">Student</label>
                <input type="checkbox" id="student" name="status" value="student">
                <br>
                <label for="graduated">Graduated</label>
                <input type="checkbox" id="graduated" name="status" value="graduated">
            </p>
            <br>
            <p>
                <input type="submit" value="Submit">
                <input type="reset" Value="Reset">
            </p>
        </fieldset>
    </form>
</body>
</html>
