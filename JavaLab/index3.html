<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <style>
        body{
            background-color: #2c3e50;
            text-align: center;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
        }
        h1{
            color: #b98f5e;
            margin : 100px;
        }
    </style>
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <script>
        let name = prompt("What is your name?");
        let g1 = Number(prompt("Your grade in first subject: "));
        let g2 = Number(prompt("Your grade in second subject: "));
        let g3 = Number(prompt("Your grade in third subject: "));
        let total = g1+g2+g3;
        let av = total/3;
        let status;
        if(av>=50) status ="You Passed!";
        else status = "You Failed";
        alert("Your name: " + name + "\n" + "Your grades: " + g1 + g2 + g3 + "\n" +
            "Total score: " + total + "\n" + "Average score:" + av + "\n" + status);
    </script>
</body>
</html>
