<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Contact Form</title>
    <link rel="stylesheet" href="styles3.css">
</head>
<body>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name here ..."> <br>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email here ... "><br>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" clos="40" placeholder="Write here ... "></textarea><br>
        
        <button type="submit">Submit</button><br>

    </form>
</body>
</html>
